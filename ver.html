<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src wss://129.146.117.49; media-src blob: mediastream:; base-uri 'none'; form-action 'none'">
<title>Transmisión - Canal</title>
<style>
  :root {
    --bg: #0E1116; --card: #161B22; --raised: #1C222B; --border: #2A313C;
    --text: #E6EAF0; --text2: #9AA4B2; --accent: #4F8CFF; --accent-hover: #6FA0FF; --talk: #3FB950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #stage { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #empty { position: absolute; color: var(--text2); font-size: 15px; text-align: center; padding: 0 24px; }
  .bar { position: absolute; left: 0; right: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px max(16px, env(safe-area-inset-left)); pointer-events: none; }
  .top { top: 0; padding-top: max(10px, env(safe-area-inset-top)); background: linear-gradient(#000a, #0000); }
  .bottom { bottom: 0; justify-content: flex-end; padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: linear-gradient(#0000, #000a); }
  .bar > * { pointer-events: auto; }
  #status { font-size: 14px; color: var(--text); text-shadow: 0 1px 3px #000; flex: 1; min-width: 0; }
  #debug { position: absolute; left: 16px; bottom: 64px; font: 12px ui-monospace, Consolas, monospace;
    color: #cfe3ff; background: #000a; padding: 4px 8px; border-radius: 6px; max-width: calc(100% - 32px); }
  .btn { font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--raised); color: var(--text); min-height: 40px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.small { font-size: 13px; padding: 6px 10px; min-height: 32px; }
  .btn:hover { border-color: var(--accent-hover); }
  .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent-hover); outline-offset: 2px; }
  #people { position: absolute; top: max(56px, calc(env(safe-area-inset-top) + 46px)); right: 12px; width: min(320px, calc(100% - 24px));
    max-height: calc(100% - 140px); overflow-y: auto; background: #161B22ee; border: 1px solid var(--border);
    border-radius: 12px; padding: 8px; }
  #people h2 { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--text2); margin: 4px 6px 8px; }
  .person { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--text2); flex: none; }
  .dot.on { background: var(--talk); border-color: var(--talk); box-shadow: 0 0 0 3px #3fb95040; }
  .who { flex: 1; min-width: 0; }
  .who .name { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .tags { font-size: 12px; color: var(--text2); }
  #ask { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); }
  #ask form { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; width: min(360px, 100%); }
  #ask h1 { margin: 0 0 4px; font-size: 20px; }
  #ask p { margin: 0 0 14px; color: var(--text2); font-size: 14px; }
  #ask label { display: block; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--text2); margin-bottom: 6px; }
  #ask input { width: 100%; padding: 10px; margin-bottom: 14px; border-radius: 10px; font: 18px system-ui, sans-serif;
    border: 1px solid var(--border); background: var(--raised); color: var(--text); }
  #ask #codein { font: 28px ui-monospace, Consolas, monospace; letter-spacing: 6px; text-align: center; text-transform: uppercase; }
  #ask .btn { width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline autoplay muted></video>
  <div id="empty">Nadie está compartiendo pantalla. Podés hablar con los demás.</div>
  <div class="bar top"><span id="status" role="status" aria-live="polite">Conectando…</span>
    <button class="btn small" id="peoplebtn" aria-expanded="true">Personas</button>
    <button class="btn small" id="retry" hidden>Reconectar</button></div>
  <div id="people"><h2>En el canal</h2><div id="list"></div></div>
  <div id="debug" hidden></div>
  <div class="bar bottom">
    <button class="btn primary" id="sound">Activar sonido</button>
    <button class="btn" id="mic" aria-pressed="false">Hablar</button>
    <button class="btn" id="full" aria-label="Pantalla completa">Pantalla completa</button>
  </div>
</div>
<div id="ask" hidden>
  <form id="askform">
    <h1>Entrar al canal</h1>
    <p>Escuchá, hablá y mirá la pantalla que compartan, sin instalar nada.</p>
    <label for="namein">Tu nombre</label>
    <input id="namein" maxlength="32" autocomplete="nickname" spellcheck="false">
    <label for="codein">Código del canal</label>
    <input id="codein" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
    <button class="btn primary" type="submit">Entrar</button>
  </form>
</div>
<script>
(function () {
  "use strict";
  var SERVER = "wss://129.146.117.49/";
  // Same alphabet as tx_proto::CODE_ALPHABET (no 0/O, 1/I/L).
  var ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  var LENGTH = 6;
  var GATHER_CAP_MS = 3000;
  var SPEAKING_LEVEL = 0.015, SPEAKING_HOLD_MS = 300;

  var params = new URLSearchParams(location.search);
  var debug = params.get("debug") === "1";
  var forceRelay = params.get("relay") === "1";

  var $ = function (id) { return document.getElementById(id); };
  var video = $("video"), statusEl = $("status"), retryBtn = $("retry"), soundBtn = $("sound"),
      micBtn = $("mic"), fullBtn = $("full"), debugEl = $("debug"), listEl = $("list"), emptyEl = $("empty");

  var code = null, name = "", ws = null, generation = 0, you = null, iceServers = [];
  var lastState = "nuevo", members = {}, soundOn = false, audioCtx = null;
  var micTrack = null, micLevel = null, meSpeakingUntil = 0, shownStream = null;

  function normalize(raw) {
    var c = String(raw || "").replace(/[\s-]/g, "").toUpperCase();
    if (c.length !== LENGTH) return null;
    for (var i = 0; i < c.length; i++) if (ALPHABET.indexOf(c.charAt(i)) === -1) return null;
    return c;
  }
  function readCode() {
    var fromHash = "";
    try { fromHash = decodeURIComponent((location.hash || "").slice(1)); } catch (e) { fromHash = ""; }
    return normalize(fromHash) || normalize(params.get("c")) || normalize(params.get("sala")) || normalize(params.get("code"));
  }
  function cleanName(raw) { return String(raw || "").replace(/[\u0000-\u001f\u007f]/g, "").replace(/\s+/g, " ").trim().slice(0, 32); }
  function savedName() { try { return localStorage.getItem("tx-name") || ""; } catch (e) { return ""; } }
  function saveName(n) { try { localStorage.setItem("tx-name", n); } catch (e) {} }

  function setStatus(text, state, canRetry) {
    statusEl.textContent = text;
    lastState = state;
    retryBtn.hidden = !canRetry;
  }

  // ---------------------------------------------------------------- audio --
  function context() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) { try { audioCtx = new Ctx(); } catch (e) { audioCtx = null; } }
    }
    return audioCtx;
  }
  // A level meter on a track: returns a function giving the current RMS.
  function meter(track) {
    var ctx = context();
    if (!ctx) return function () { return 0; };
    try {
      var source = ctx.createMediaStreamSource(new MediaStream([track]));
      var analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      var data = new Float32Array(analyser.fftSize);
      return function () {
        analyser.getFloatTimeDomainData(data);
        var sum = 0;
        for (var i = 0; i < data.length; i++) sum += data[i] * data[i];
        return Math.sqrt(sum / data.length);
      };
    } catch (e) { return function () { return 0; }; }
  }

  function applySound() {
    Object.keys(members).forEach(function (id) {
      var m = members[id];
      if (m.voiceEl) m.voiceEl.muted = !soundOn || m.muted;
    });
    video.muted = !soundOn;
    soundBtn.hidden = soundOn;
  }

  soundBtn.onclick = function () {
    soundOn = true;
    var ctx = context();
    if (ctx && ctx.resume) ctx.resume().catch(function () {});
    applySound();
    video.play().catch(function () {});
    Object.keys(members).forEach(function (id) { var el = members[id].voiceEl; if (el) el.play().catch(function () {}); });
  };

  function sendState() {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "state", mic: !!micTrack, sharing: false }));
  }

  function stopMic() {
    if (micTrack) { try { micTrack.stop(); } catch (e) {} }
    micTrack = null; micLevel = null;
    Object.keys(members).forEach(function (id) {
      var tx = members[id].voiceTx;
      if (tx) { try { tx.sender.replaceTrack(null); } catch (e) {} }
    });
    micBtn.textContent = "Hablar";
    micBtn.setAttribute("aria-pressed", "false");
    micBtn.classList.remove("primary");
    sendState();
  }

  micBtn.onclick = function () {
    if (micTrack) return stopMic();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return setStatus("Este navegador no deja usar el micrófono.", lastState, false);
    }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
      .then(function (media) {
        var track = media.getAudioTracks()[0];
        if (!track) return;
        micTrack = track;
        micLevel = meter(track);
        Object.keys(members).forEach(function (id) {
          var tx = members[id].voiceTx;
          if (tx) tx.sender.replaceTrack(track).catch(function () {});
        });
        micBtn.textContent = "Silenciar micrófono";
        micBtn.setAttribute("aria-pressed", "true");
        micBtn.classList.add("primary");
        if (!soundOn) soundBtn.onclick();
        sendState();
      })
      .catch(function () { stopMic(); setStatus("No se pudo usar el micrófono (revisá el permiso del navegador).", lastState, false); });
  };

  // ------------------------------------------------------------- members --
  function addMember(info) {
    var m = members[info.id] || { info: info, pc: null, voiceTx: null, voiceEl: null, level: null,
      speakingUntil: 0, muted: false, video: null, sound: null, offering: false };
    m.info = info;
    members[info.id] = m;
    render();
    return m;
  }

  function removeMember(id) {
    var m = members[id];
    if (!m) return;
    if (m.pc) { m.pc.ontrack = m.pc.onconnectionstatechange = null; try { m.pc.close(); } catch (e) {} }
    if (m.voiceEl) { m.voiceEl.srcObject = null; m.voiceEl.remove(); }
    delete members[id];
    showSharer();
    render();
  }

  function makePc(m) {
    var config = { iceServers: iceServers, bundlePolicy: "max-bundle" };
    if (forceRelay) config.iceTransportPolicy = "relay";
    var p = new RTCPeerConnection(config);
    m.pc = p;
    p.ontrack = function (e) {
      try { if ("jitterBufferTarget" in e.receiver) e.receiver.jitterBufferTarget = 0; } catch (x) {}
      if (e.track.kind === "video") { m.video = e.track; showSharer(); return; }
      // The last audio m-line is voice chat; an earlier one, the shared sound.
      var audios = p.getTransceivers().filter(function (t) { return t.receiver.track.kind === "audio"; });
      if (e.transceiver === audios[audios.length - 1]) {
        var el = m.voiceEl || document.createElement("audio");
        el.autoplay = true;
        el.srcObject = new MediaStream([e.track]);
        m.voiceEl = el;
        if (!el.parentNode) document.body.appendChild(el);
        m.level = meter(e.track);
        applySound();
        el.play().catch(function () {});
      } else {
        m.sound = e.track;
        showSharer();
      }
    };
    p.onconnectionstatechange = function () {
      if (p.connectionState === "failed") setStatus("No se pudo conectar con " + m.info.name + ".", lastState, false);
      render();
    };
    return p;
  }

  // Makes the voice transceiver send my microphone (when it is on).
  function useVoice(m, tx) {
    m.voiceTx = tx;
    tx.direction = "sendrecv";
    if (micTrack) tx.sender.replaceTrack(micTrack).catch(function () {});
  }

  function withVoice(sdp) { return sdp.replace(/\r?\n?$/, "\r\n") + "a=x-tx-voice\r\n"; }

  function signal(id, sdp) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "signal", to: id, sdp: sdp }));
  }

  // I joined after another browser: I offer (voice only; browsers do not share).
  function offerTo(m) {
    var p = makePc(m);
    m.offering = true;
    var tx = p.addTransceiver("audio", { direction: "sendrecv" });
    useVoice(m, tx);
    p.createOffer()
      .then(function (o) { return p.setLocalDescription(o); })
      .then(function () { return gathered(p); })
      .then(function () { signal(m.info.id, withVoice(p.localDescription.sdp)); })
      .catch(function () {});
  }

  function answerTo(m, sdp) {
    if (m.pc) { try { m.pc.close(); } catch (e) {} }
    var p = makePc(m);
    p.setRemoteDescription({ type: "offer", sdp: sdp })
      .then(function () {
        var audios = p.getTransceivers().filter(function (t) { return t.receiver.track.kind === "audio"; });
        if (audios.length) useVoice(m, audios[audios.length - 1]);
        return p.createAnswer();
      })
      .then(function (a) { return p.setLocalDescription(a); })
      .then(function () { return gathered(p); })
      .then(function () { signal(m.info.id, withVoice(p.localDescription.sdp)); })
      .catch(function (e) { setStatus("No se pudo conectar con " + m.info.name + ": " + (e && e.message ? e.message : e), lastState, false); });
  }

  function gathered(p) {
    return new Promise(function (resolve) {
      if (p.iceGatheringState === "complete") return resolve();
      var done = false;
      function finish() {
        if (done) return;
        done = true;
        p.removeEventListener("icegatheringstatechange", check);
        clearTimeout(timer);
        resolve();
      }
      function check() { if (p.iceGatheringState === "complete") finish(); }
      var timer = setTimeout(finish, GATHER_CAP_MS);
      p.addEventListener("icegatheringstatechange", check);
    });
  }

  // Shows whoever shares: their video and the sound of their screen.
  function sharer() {
    var found = null;
    Object.keys(members).forEach(function (id) { if (!found && members[id].info.sharing) found = members[id]; });
    return found;
  }
  function showSharer() {
    var s = sharer();
    var tracks = s && s.video ? [s.video].concat(s.sound ? [s.sound] : []) : [];
    var key = tracks.map(function (t) { return t.id; }).join(",");
    emptyEl.hidden = tracks.length > 0;
    if (shownStream && shownStream.key === key) return;
    shownStream = tracks.length ? new MediaStream(tracks) : null;
    if (shownStream) shownStream.key = key;
    video.srcObject = shownStream;
    if (shownStream) video.play().catch(function () {});
  }

  function text(tag, content, cls) {
    var el = document.createElement(tag);
    el.textContent = content;
    if (cls) el.className = cls;
    return el;
  }

  // Rows are kept and updated in place: rebuilding them ten times a second
  // replaced the buttons between press and release, so clicks were lost.
  var rows = {};
  function rowFor(key, withButton) {
    if (rows[key]) return rows[key];
    var r = document.createElement("div");
    r.className = "person";
    var dot = document.createElement("span");
    dot.className = "dot";
    var who = document.createElement("div");
    who.className = "who";
    var nm = text("div", "", "name");
    var tags = text("div", "", "tags");
    who.appendChild(nm);
    who.appendChild(tags);
    r.appendChild(dot);
    r.appendChild(who);
    var button = null;
    if (withButton) {
      button = document.createElement("button");
      button.className = "btn small";
      button.onclick = function () {
        var m = members[key];
        if (!m) return;
        m.muted = !m.muted;
        applySound();
        render();
      };
      r.appendChild(button);
    }
    rows[key] = { row: r, dot: dot, name: nm, tags: tags, button: button };
    return rows[key];
  }

  function fill(entry, nameText, tagsText, speaking, buttonText) {
    if (entry.name.textContent !== nameText) entry.name.textContent = nameText;
    if (entry.tags.textContent !== tagsText) entry.tags.textContent = tagsText;
    entry.tags.hidden = !tagsText;
    var cls = "dot" + (speaking ? " on" : "");
    if (entry.dot.className !== cls) entry.dot.className = cls;
    entry.dot.setAttribute("aria-label", speaking ? "hablando" : "");
    if (entry.button && entry.button.textContent !== buttonText) entry.button.textContent = buttonText;
  }

  function render() {
    var now = Date.now();
    if (you === null) {
      listEl.textContent = "";
      rows = {};
      return;
    }
    var order = ["me"];
    fill(rowFor("me", false), name + " (vos)", micTrack ? "" : "micrófono apagado", now < meSpeakingUntil, "");
    Object.keys(members).map(Number).sort(function (a, b) { return a - b; }).forEach(function (id) {
      var m = members[id];
      var tags = [];
      if (!m.info.mic) tags.push("micrófono apagado");
      if (m.info.sharing) tags.push("comparte pantalla");
      if (m.info.web) tags.push("navegador");
      if (m.muted) tags.push("silenciado por vos");
      if (!m.pc || m.pc.connectionState !== "connected") tags.push("conectando…");
      fill(rowFor(id, true), m.info.name, tags.join(" · "), !m.muted && now < m.speakingUntil, m.muted ? "Activar sonido" : "Silenciar");
      order.push(id);
    });
    Object.keys(rows).forEach(function (key) {
      if (order.indexOf(key === "me" ? "me" : Number(key)) === -1) {
        rows[key].row.remove();
        delete rows[key];
      }
    });
    // Append in order (moving an existing node keeps it, and its button, alive).
    order.forEach(function (key, i) {
      var r = rows[key].row;
      if (listEl.children[i] !== r) listEl.insertBefore(r, listEl.children[i] || null);
    });
  }

  // Speaking indicators: levels ten times a second.
  setInterval(function () {
    var now = Date.now();
    if (micLevel && micLevel() > SPEAKING_LEVEL) meSpeakingUntil = now + SPEAKING_HOLD_MS;
    Object.keys(members).forEach(function (id) {
      var m = members[id];
      if (m.level && m.level() > SPEAKING_LEVEL) m.speakingUntil = now + SPEAKING_HOLD_MS;
    });
    render();
  }, 100);

  // ------------------------------------------------------------ signaling --
  function closeAll() {
    generation++;
    var w = ws;
    ws = null;
    if (w) { w.onopen = w.onmessage = w.onerror = w.onclose = null; try { w.close(1000); } catch (e) {} }
    Object.keys(members).forEach(removeMember);
    you = null;
    video.srcObject = null;
    shownStream = null;
  }

  function fail(textMsg) {
    closeAll();
    setStatus(textMsg, "error", true);
  }

  function describeError(reason) {
    var r = String(reason || "").toLowerCase();
    if (r.indexOf("no such") !== -1 || r.indexOf("no existe") !== -1) return "No existe un canal con ese código.";
    if (r.indexOf("full") !== -1 || r.indexOf("llen") !== -1) return "El canal está lleno.";
    if (r.indexOf("name") !== -1) return "Ese nombre no sirve: probá con otro.";
    return "El servidor rechazó la conexión" + (reason ? ": " + reason : ".");
  }

  function connect() {
    closeAll();
    var mine = generation;
    setStatus("Conectando…", "conectando", false);
    var socket;
    try { socket = new WebSocket(SERVER); } catch (e) { return fail("No se pudo conectar con el servidor."); }
    ws = socket;
    socket.onopen = function () {
      if (mine !== generation) return;
      socket.send(JSON.stringify({ t: "join_channel", code: code, name: name }));
    };
    socket.onclose = function () {
      if (mine !== generation) return;
      fail(you === null ? "No se pudo conectar con el servidor." : "Se cortó la conexión con el servidor.");
    };
    socket.onmessage = function (event) {
      if (mine !== generation) return;
      var msg;
      try { msg = JSON.parse(event.data); } catch (e) { return; }
      switch (msg.t) {
        case "channel_joined":
          you = msg.you;
          iceServers = msg.ice_servers || [];
          setStatus("En el canal " + msg.code, "conectado", false);
          (msg.members || []).forEach(function (info) {
            var m = addMember(info);
            // Natives always offer to browsers; between browsers, the newcomer (me).
            if (info.web) offerTo(m);
          });
          sendState();
          showSharer();
          break;
        case "member_joined":
          addMember(msg.member); // the newcomer offers to me
          break;
        case "member_left":
          removeMember(msg.id);
          break;
        case "member_state":
          if (members[msg.id]) {
            members[msg.id].info.mic = !!msg.mic;
            members[msg.id].info.sharing = !!msg.sharing;
            showSharer();
            render();
          }
          break;
        case "signal":
          var m = members[msg.from];
          if (!m || !msg.sdp) return;
          if (m.offering && m.pc && m.pc.signalingState === "have-local-offer") {
            m.pc.setRemoteDescription({ type: "answer", sdp: msg.sdp }).catch(function () {});
          } else {
            answerTo(m, msg.sdp);
          }
          break;
        case "error":
          fail(describeError(msg.reason));
          break;
      }
    };
  }

  // ---------------------------------------------------------- diagnostics --
  window.txStats = function () {
    var s = sharer();
    var p = s && s.pc;
    var out = { state: p ? p.connectionState : "sin conexión", members: Object.keys(members).length, framesDecoded: 0,
                frameWidth: 0, frameHeight: 0, fps: 0, bytesReceived: 0 };
    if (!p) return Promise.resolve(out);
    return p.getStats().then(function (report) {
      report.forEach(function (st) {
        if (st.type === "inbound-rtp" && (st.kind || st.mediaType) === "video") {
          out.framesDecoded = st.framesDecoded || 0;
          out.frameWidth = st.frameWidth || 0;
          out.frameHeight = st.frameHeight || 0;
          out.fps = st.framesPerSecond || 0;
          out.bytesReceived = st.bytesReceived || 0;
        }
      });
      return out;
    }).catch(function () { return out; });
  };
  setInterval(function () {
    if (!debug) return;
    debugEl.hidden = false;
    window.txStats().then(function (s) {
      debugEl.textContent = s.state + " · " + s.members + " personas · " + s.frameWidth + "x" + s.frameHeight + " · " +
        Math.round(s.fps) + " fps · " + (s.bytesReceived / 1e6).toFixed(2) + " MB";
    });
  }, 1000);

  // ------------------------------------------------------------ interface --
  function fullscreenElement() { return document.fullscreenElement || document.webkitFullscreenElement; }
  fullBtn.onclick = function () {
    var stage = $("stage");
    if (fullscreenElement()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (stage.requestFullscreen) {
      stage.requestFullscreen().catch(function () {});
    } else if (stage.webkitRequestFullscreen) {
      stage.webkitRequestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen(); // iPhone: only the video element can go fullscreen
    }
  };
  $("peoplebtn").onclick = function () {
    var panel = $("people");
    panel.hidden = !panel.hidden;
    $("peoplebtn").setAttribute("aria-expanded", String(!panel.hidden));
  };
  retryBtn.onclick = connect;
  window.addEventListener("pagehide", closeAll);
  window.addEventListener("pageshow", function (e) { if (e.persisted && code && name) connect(); });

  $("askform").addEventListener("submit", function (e) {
    e.preventDefault();
    var c = normalize($("codein").value);
    var n = cleanName($("namein").value);
    if (!n) { $("namein").focus(); return; }
    if (!c) { $("codein").focus(); return; }
    code = c; name = n;
    saveName(n);
    $("ask").hidden = true;
    try { history.replaceState(null, "", location.pathname + location.search + "#" + c); } catch (x) {}
    connect();
  });

  code = readCode();
  name = cleanName(savedName());
  if (code && name) connect();
  else {
    $("ask").hidden = false;
    $("namein").value = name;
    if (code) $("codein").value = code;
    (name ? $("codein") : $("namein")).focus();
    setStatus("Escribí tu nombre y el código.", "sin datos", false);
  }
})();
</script>
</body>
</html>
